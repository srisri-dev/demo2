<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate AI - Movie Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);display:flex;justify-content:center;align-items:center;padding:20px}
.chat-container{width:100%;max-width:850px;height:85vh;background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.header{background:#1e1b4b;color:white;padding:22px;text-align:center}
.header h1{margin:0 0 7px}.header p{margin:0;opacity:.85}
#chat-box{flex:1;overflow-y:auto;padding:20px;background:#f5f5f5}
.message{max-width:78%;padding:12px 15px;margin:10px 0;border-radius:15px;line-height:1.5;white-space:pre-wrap}
.bot{background:white;border:1px solid #e5e7eb;margin-right:auto}
.user{background:#4f46e5;color:white;margin-left:auto}
.input-area{display:flex;gap:10px;padding:15px;background:white;border-top:1px solid #ddd}
#message-input{flex:1;border:1px solid #ccc;border-radius:10px;padding:13px;font-size:16px;outline:none}
#send-button{border:0;border-radius:10px;padding:0 22px;background:#4f46e5;color:white;font-size:16px;cursor:pointer}
#send-button:disabled{opacity:.6;cursor:not-allowed}
@media(max-width:600px){.chat-container{height:92vh}.message{max-width:90%}}
</style>
</head>
<body>
<div class="chat-container">
<div class="header"><h1>🎬 StudyMate AI</h1><p>Movie & Cinema Assistant</p></div>
<div id="chat-box">
<div class="message bot">Hi! I'm StudyMate AI 🎬
Ask me about movies, actors, directors, genres, plots, awards, recommendations, or cinema.</div>
</div>
<div class="input-area">
<input id="message-input" type="text" placeholder="Ask a movie-related question..." autocomplete="off">
<button id="send-button">Send</button>
</div>
</div>
<script>
const input=document.getElementById("message-input");
const button=document.getElementById("send-button");
const chatBox=document.getElementById("chat-box");

function addMessage(text,type){
 const message=document.createElement("div");
 message.className="message "+type;
 message.textContent=text;
 chatBox.appendChild(message);
 chatBox.scrollTop=chatBox.scrollHeight;
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;
 addMessage(message,"user");
 input.value="";
 button.disabled=true;
 try{
  const response=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await response.json();
  addMessage(response.ok?data.reply:(data.error||"Something went wrong."),"bot");
 }catch(error){
  addMessage("Could not connect to the Flask server. Please check that app.py is running.","bot");
 }finally{
  button.disabled=false;
  input.focus();
 }
}
button.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
</script>
</body>
</html>
